services:
  backend:
    build:
      context: ./backend
    image: vio-backend:aula05
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
    image: vio-frontend:aula05
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
