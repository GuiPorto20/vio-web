name: Validar aplicação Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir e iniciar os containers
        run: docker compose up -d --build --wait --wait-timeout 120
        env:
          HTTP_PORT: 8080
      - name: Validar frontend e API através do Nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/status | grep -Eq '"status"[[:space:]]*:[[:space:]]*"online"'
          curl -fsS http://localhost:8080/api/eventos | grep -q 'Festival de Tecnologia'
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Encerrar containers
        if: always()
        run: docker compose down
